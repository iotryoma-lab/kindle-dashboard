name: Render Kindle dashboard

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'dash.html'
      - 'render.js'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node render.js
        env:
          TZ: Asia/Tokyo
      - name: Commit image
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add dashboard.png
          git commit -m "Update dashboard image" || exit 0
          git push
