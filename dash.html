<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Dashboard (render)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: #000; }
  body {
    width: 600px; height: 800px; overflow: hidden;
    font-family: 'Courier New', Courier, monospace, sans-serif;
    position: relative;
  }
  .wrap { position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; border: 3px solid #000; }
  .main { position: absolute; top: 8px; left: 8px; right: 8px; height: 712px; }

  /* 左カラム：日付 + 天気 */
  .left { position: absolute; top: 0; left: 0; width: 37%; height: 652px; }
  .box { border: 3px solid #000; padding: 8px; }
  .clock { text-align: center; height: 76px; padding: 8px 2px; }
  .date { font-size: 22px; font-weight: bold; line-height: 1.25; }
  .weather { position: absolute; top: 86px; left: 0; right: 0; bottom: 0; padding: 6px 5px; }
  .wtitle { font-size: 15px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 3px; }
  .wsum { font-size: 14px; font-weight: bold; margin: 10px 0 8px; white-space: nowrap; }
  .wsum span { margin-right: 4px; }
  table.hourly { width: 100%; border-collapse: collapse; text-align: center; font-size: 15px; font-weight: bold; }
  table.hourly th { font-size: 12px; border-bottom: 2px solid #000; padding-bottom: 2px; }
  table.hourly td { padding: 11px 0; border-bottom: 1px solid #000; }

  /* 右カラム：カレンダー（左の天気の枠と下端を揃える） */
  .right { position: absolute; top: 0; left: 39%; right: 0; height: 712px; }
  .cal { position: absolute; top: 0; left: 0; right: 0; height: 652px; padding: 18px 10px; }
  .cal-head { font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 18px; }
  table.calt { width: 100%; border-collapse: collapse; text-align: center; font-size: 24px; font-weight: bold; }
  table.calt th { border-bottom: 2px solid #000; padding-bottom: 5px; font-size: 14px; }
  table.calt td { padding: 28px 0; }
  table.calt td.today { background: #000; color: #fff; }

  /* 飾り：枠なし・右下の端に詰める */
  .art { position: absolute; right: 0; bottom: 0; font-size: 0; line-height: 0; white-space: nowrap; }
  .art img { width: 56px; height: 56px; image-rendering: pixelated; margin-left: 1px; }

  /* 更新ボタン（天気の下）：Kindle では画面のどこをタッチしても更新 */
  .tapbtn { position: absolute; left: 0; top: 662px; width: 37%; height: 46px; background: #000; color: #fff;
            font-size: 18px; font-weight: bold; text-align: center; line-height: 46px; }

  /* フッター */
  .footer { position: absolute; left: 8px; right: 8px; bottom: 6px; height: 44px; border-top: 3px solid #000; }
  .status { font-size: 12px; font-weight: bold; line-height: 40px; }
  .btn {
    position: absolute; right: 0; top: 5px;
    border: 3px solid #000; background: #000; color: #fff;
    padding: 4px 18px; font-size: 16px; font-weight: bold; font-family: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="left">
      <div class="box clock">
        <div class="date" id="date">----.--.--<br>(---)</div>
      </div>
      <div class="box weather">
        <div class="wtitle">■ WEATHER (大宮)</div>
        <div class="wsum"><span id="wstatus">---</span><span><span id="tmax">--</span>°/<span id="tmin">--</span>°</span><span>降水<span id="pop">--</span>%</span></div>
        <table class="hourly" id="hourly"></table>
      </div>
    </div>

    <div class="tapbtn">更新</div>

    <div class="right">
      <div class="box cal">
        <div class="cal-head" id="calhead">----</div>
        <table class="calt" id="cal"></table>
      </div>
      <div class="art">
        <img src="d-m-grey.gif" alt=""><img src="d-grey.gif" alt=""><img src="d-agu.gif" alt=""><img src="d-s-grey.gif" alt="">
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="status" id="status">LAST UPDATE: --:--</div>
  </div>
</div>

<script>
/* Kindle の古いブラウザ向けに ES5 で記述 */
var DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
var MON = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
function p2(n){ return (n < 10 ? '0' : '') + n; }
function $(id){ return document.getElementById(id); }

/* Kindle のブラウザは時刻が UTC になるので、日本時間（UTC+9）に直す */
function jst(){
  var d = new Date();
  return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 9 * 3600000);
}

function iconName(c){
  if (c === 0) return 'sun';
  if (c <= 2) return 'partly';
  if (c === 3) return 'cloud';
  if (c === 45 || c === 48) return 'fog';
  if (c >= 51 && c <= 67) return 'rain';
  if (c >= 71 && c <= 77) return 'snow';
  if (c >= 80 && c <= 82) return 'rain';
  if (c >= 85 && c <= 86) return 'snow';
  if (c >= 95) return 'thunder';
  return 'cloud';
}
function icon(c, size){
  return '<img src="icon-' + iconName(c) + '.png" width="' + size + '" height="' + size + '" alt="" style="vertical-align:middle">';
}

function drawClock(){
  var d = jst();
  $('date').innerHTML = d.getFullYear() + '.' + p2(d.getMonth()+1) + '.' + p2(d.getDate()) + ' (' + DOW[d.getDay()] + ')';
  $('status').innerHTML = 'LAST UPDATE: ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  return d;
}

function drawCalendar(d){
  var y = d.getFullYear(), m = d.getMonth(), today = d.getDate();
  $('calhead').innerHTML = y + ' ' + MON[m];
  var first = new Date(y, m, 1).getDay();
  var days = new Date(y, m + 1, 0).getDate();
  var h = '<tr>';
  for (var i = 0; i < 7; i++) h += '<th>' + DOW[i].substr(0,2) + '</th>';
  h += '</tr><tr>';
  var col = 0, k;
  for (k = 0; k < first; k++) { h += '<td></td>'; col++; }
  for (var day = 1; day <= days; day++) {
    h += '<td' + (day === today ? ' class="today"' : '') + '>' + day + '</td>';
    col++;
    if (col === 7 && day < days) { h += '</tr><tr>'; col = 0; }
  }
  while (col > 0 && col < 7) { h += '<td></td>'; col++; }
  h += '</tr>';
  $('cal').innerHTML = h;
}

function drawHourly(hh, now){
  /* 次の3の倍数の時刻から、3時間ごとに8コマ（時刻は日本時間） */
  var today = now.getFullYear() + '-' + p2(now.getMonth()+1) + '-' + p2(now.getDate());
  var start = Math.floor(now.getHours() / 3) * 3 + 3;
  var startIdx = -1, i;
  if (start < 24) {
    var key = today + 'T' + p2(start) + ':00';
    for (i = 0; i < hh.time.length; i++) { if (hh.time[i] === key) { startIdx = i; break; } }
  } else {
    for (i = 0; i < hh.time.length; i++) {
      if (hh.time[i].substr(11,5) === '00:00' && hh.time[i].substr(0,10) !== today) { startIdx = i; break; }
    }
  }
  if (startIdx < 0) { $('hourly').innerHTML = ''; return; }
  var h = '<tr><th>時刻</th><th>天気</th><th>気温</th><th>降水</th></tr>';
  for (i = 0; i < 8 && startIdx + i * 3 < hh.time.length; i++) {
    var k = startIdx + i * 3;
    h += '<tr><td>' + hh.time[k].substr(11,5) + '</td><td>' + icon(hh.weather_code[k], 26) + '</td><td>' +
         Math.round(hh.temperature_2m[k]) + '°</td><td>' + hh.precipitation_probability[k] + '%</td></tr>';
  }
  $('hourly').innerHTML = h;
}

function loadWeather(now){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=35.906&longitude=139.624' +
            '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
            '&hourly=weather_code,temperature_2m,precipitation_probability' +
            '&timezone=Asia%2FTokyo&forecast_days=2';
  var x = new XMLHttpRequest();
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status !== 200) { $('wstatus').innerHTML = '取得失敗'; return; }
    try {
      var r = JSON.parse(x.responseText), j = r.daily;
      $('wstatus').innerHTML = icon(j.weather_code[0], 28);
      $('tmax').innerHTML = Math.round(j.temperature_2m_max[0]);
      $('tmin').innerHTML = Math.round(j.temperature_2m_min[0]);
      $('pop').innerHTML = j.precipitation_probability_max[0];
      drawHourly(r.hourly, now);
      document.body.setAttribute('data-ready','1');
    } catch (e) { $('wstatus').innerHTML = '取得失敗'; }
  };
  x.open('GET', url, true);
  x.send(null);
}

function refresh(){
  var d = drawClock();
  drawCalendar(d);
  loadWeather(d);
}
refresh();
</script>
</body>
</html>
